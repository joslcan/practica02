<div class="container py-5">
  <div class="text-center mb-5">
    <h1 class="text-danger">Ofertas Especiales</h1>

    <p class="lead">Aprovecha los mejores descuentos de AntojApp.</p>
  </div>

  <div class="row">
    <div class="col-md-3 mb-4" *ngFor="let oferta of ofertas">
      <div class="card shadow h-100 oferta-card">
        <img [src]="oferta.imagen" class="card-img-top" alt="producto" />

        <div class="card-body text-center">
          <h5 class="card-title">
            {{ oferta.nombre }}
          </h5>

          <p class="text-decoration-line-through text-muted">
            {{ oferta.precio | currency: 'PEN' : 'symbol' : '1.2-2' : 'es-PE' }}
          </p>

          <h4 class="text-danger">
            {{ oferta.descuento | currency: 'PEN' : 'symbol' : '1.2-2' : 'es-PE' }}
          </h4>

          <button class="btn btn-danger w-100">Comprar</button>
        </div>
      </div>
    </div>
  </div>
</div>
