<section class="hero">

  <div class="container text-center">

    <h1 class="display-3 fw-bold">
      {{ titulo }}

    <p class="lead">
      {{ descripcion }}
    </p>

    <a
      routerLink="/productos"
      class="btn btn-warning btn-lg mt-3">

      Ver Productos

    </a>

  </div>

</section>
