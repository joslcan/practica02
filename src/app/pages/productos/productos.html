<div class="container mt-5 pt-5">
  <h1 class="text-center mb-4">Productos</h1>
  <div class="mb-4">
    <input type="text" class="form-control" placeholder="Buscar producto..." [(ngModel)]="filtro" />
  </div>

  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let producto of filtrarProductos()">
      <div
        class="card shadow h-100"
        [ngClass]="{ 'border-success': producto.stock > 5, 'border-danger': producto.stock <= 5 }"
      >
        <img [src]="producto.imagen" class="card-img-top" />

        <div class="card-body">
          <h4>
            {{ producto.nombre | uppercase }}
          </h4>

          <p>
            Categoría:
            <strong>
              {{ producto.categoria }}
            </strong>
          </p>

          <p>
            Precio:
            <strong>
              {{ producto.precio | currency: 'PEN' }}
            </strong>
          </p>

          <p [ngStyle]="{ color: producto.stock > 5 ? 'green' : 'red' }">
            Stock:
            {{ producto.stock }}
          </p>

          <button class="btn btn-warning w-100">Comprar</button>
        </div>
      </div>
    </div>
  </div>
</div>
